<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chụp Đẹp">
<title>Chụp Đẹp - Hướng dẫn chụp ảnh</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Chọn bạn muốn chụp gì -->
<section id="home" class="screen active">
  <header>
    <h1>📸 Chụp Đẹp</h1>
    <p>Bạn muốn chụp gì? App sẽ chỉ <b>từng bước một</b>, làm xong bước nào thì sang bước đó.</p>
  </header>
  <div id="modes" class="modes"></div>
  <button id="openList" class="listBtn">📋 Danh sách chụp cả quán <b id="listCount">0/0</b></button>
  <button id="openGallery" class="link">🖼️ Ảnh đã chụp (<span id="count">0</span>)</button>
</section>

<!-- Chuẩn bị trước khi mở camera -->
<section id="prep" class="screen">
  <div class="prepTop"><button id="prepBack">←</button><span id="prepTitle"></span><button id="prepSkip" class="skip">Bỏ qua</button></div>
  <div class="prepBody">
    <div id="prepIcon" class="bigIcon"></div>
    <div id="prepDots" class="dots"></div>
    <h2 id="prepHead"></h2>
    <p id="prepText"></p>
    <div id="prepDiagram" class="diagram"></div>
  </div>
  <button id="prepNext" class="primary">Tiếp →</button>
</section>

<!-- Chọn góc chụp -->
<section id="angles" class="screen">
  <div class="prepTop"><button id="anglesBack">←</button><span id="anglesTitle"></span><span></span></div>
  <div class="anglesBody">
    <p id="anglesHint" class="hint"></p>
    <div id="angleList" class="angleList"></div>
    <button id="reviewPrep" class="link">📋 Xem lại cách chuẩn bị</button>
  </div>
</section>

<!-- Camera -->
<section id="camera" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="grid" class="overlay"></canvas>
  <svg id="guide" class="overlay" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="level" class="level"><div class="bar"></div></div>
  <div id="flash"></div>
  <div id="countdown"></div>

  <div class="top">
    <button id="back" aria-label="Quay lại">✕</button>
    <span id="modeName"></span>
    <div class="toggles">
      <button id="toggleGrid" class="on" aria-label="Lưới">▦</button>
      <button id="burstBtn" aria-label="Chụp 3 tấm chọn tấm nét nhất">3×</button>
      <button id="timerBtn" aria-label="Hẹn giờ">⏱ <b id="timerVal">0</b>s</button>
    </div>
  </div>

  <div id="stepBox" class="stepBox">
    <div class="stepHead"><span id="stepLabel"></span><div id="stepDots" class="dots small"></div></div>
    <div class="stepMain">
      <div class="stepText">
        <div id="stepTitle" class="stepTitle"></div>
        <div id="stepDesc" class="stepDesc"></div>
      </div>
      <div id="stepDiagram" class="diagram mini"></div>
    </div>
    <div id="stepStatus" class="stepStatus"></div>
    <div class="stepBtns">
      <button id="stepDone" class="primary small hidden">Xong ✓</button>
      <button id="stepSkip" class="skip hidden">Bỏ qua bước này</button>
    </div>
  </div>

  <div class="bottom">
    <button id="sampleBtn" class="chip">🖼️ Xem ảnh mẫu</button>
    <div class="controls">
      <button id="lastThumb" class="thumb" aria-label="Ảnh gần nhất"></button>
      <button id="shutter" aria-label="Chụp"><span></span></button>
      <button id="flip" aria-label="Đổi camera">🔄</button>
    </div>
  </div>

  <div id="error" class="error hidden"></div>
</section>

<!-- Xem lại + làm đẹp ảnh -->
<section id="review" class="screen">
  <div class="reviewImgBox"><img id="reviewImg" alt="Ảnh"></div>
  <div class="editPanel">
    <div id="reviewCoach" class="coach"></div>
    <div class="editRow">
      <button id="enhanceBtn" class="chipBtn on">✨ Làm đẹp</button>
      <div id="ratioChips" class="ratios">
        <button data-r="orig" class="on">Gốc</button><button data-r="4:5">4:5</button><button data-r="1:1">1:1</button><button data-r="9:16">9:16</button>
      </div>
    </div>
    <input id="capInput" class="capInput" type="text" maxlength="60" placeholder="Chèn chữ lên ảnh (tên quán, giá món…)">
  </div>
  <div class="reviewBtns">
    <button id="retake">↩ Chụp lại</button>
    <button id="nextAngle">▶ Góc khác</button>
    <button id="delBtn">🗑</button>
    <button id="saveBtn" class="btn">⬆ Lưu / Chia sẻ</button>
  </div>
</section>

<!-- Danh sách chụp cả quán -->
<section id="list" class="screen">
  <div class="prepTop"><button id="listBack">←</button><span>📋 Chụp cả quán</span><span></span></div>
  <p class="hint listHint">Chụp đủ các góc bên dưới. Góc nào có ✓ là đã chụp rồi. Bấm vào để chụp.</p>
  <div id="listBody" class="listBody"></div>
</section>

<!-- Thư viện -->
<section id="gallery" class="screen">
  <div class="top solid"><button id="galleryBack">←</button><span>Ảnh đã chụp</span><span></span></div>
  <div id="galleryGrid" class="galleryGrid"></div>
</section>

<div id="sampleModal" class="modal hidden">
  <div class="mcard">
    <div id="sampleBig" class="bigSample"></div>
    <h3 id="sampleName"></h3><p id="sampleDesc"></p>
    <ul id="sampleTips"></ul>
    <button id="sampleClose" class="primary">Đã hiểu</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
